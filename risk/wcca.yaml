# Worst-case circuit analysis inputs. Run: python tools/wcca.py risk/wcca.yaml
supply:
  battery_v: {min: 10.5, nom: 12.8, max: 14.7}   # SLA discharged .. charging (verify charger profile)
  mcu_vdd: {min: 3.2, nom: 3.3, max: 3.4}         # to verify against UNO Q docs
  hcsr04_echo_v: {min: 4.5, nom: 5.0, max: 5.25}  # HC-SR04 echo high level = its 5 V supply (to measure)
dividers:
  - name: battery_sense
    req: Vout at Vbat_max <= 0.95*ADC_ref_min and resolution < 50 mV/bit equivalent
    r_top: {nom: 33000, tol: 0.01}
    r_bot: {nom: 8200, tol: 0.01}
    vin_key: battery_v
    vout_limit: 3.10
  - name: hcsr04_echo                              # SR-022; 5 V echo -> MCU pin (two sensors, same divider)
    req: Vout at Vecho_max <= 3.3 V (pin may not be 5 V tolerant on the UNO Q, to verify) and Vout min >= VIH 2.31 V
    r_top: {nom: 15000, tol: 0.01}
    r_bot: {nom: 22000, tol: 0.01}
    vin_key: hcsr04_echo_v
    vout_limit: 3.30
logic:
  - name: bumper_switch_to_mcu
    driver: {voh_min: 3.2, vol_max: 0.1}          # switch with pull-up to 3.3 V
    receiver: {vih_min: 2.31, vil_max: 0.99}      # 0.7/0.3 VDD typical CMOS - verify STM32U585 datasheet
  - name: hcsr04_echo_via_divider_to_mcu        # SR-022; HC-SR04 at 5 V, echo through hcsr04_echo divider
    driver: {voh_min: 2.65, vol_max: 0.12}        # 4.5 V min echo high through 15k/22k 1 % (min ratio 0.588); 0.2 V low
    receiver: {vih_min: 2.31, vil_max: 0.99}      # STM32U585 CMOS 0.7/0.3 VDD (verify datasheet / UNO Q pin)
  - name: mcu_trig_to_hcsr04                       # 3.3 V GPIO into the HC-SR04 TRIG (5 V part)
    driver: {voh_min: 2.9, vol_max: 0.4}
    receiver: {vih_min: 2.0, vil_max: 0.8}        # assumed TTL-like input on the module (to verify on the bought part)
  - name: hx711_dout_to_mcu
    driver: {voh_min: 2.9, vol_max: 0.4}          # HX711 powered at 3.3 V (verify module)
    receiver: {vih_min: 2.31, vil_max: 0.99}
power:
  branches:
    - {name: drive, nom_a: 3.0, peak_a: 12.0, fuse_a: 15, wire_awg: 14}
    - {name: collection, nom_a: 10.0, peak_a: 25.0, fuse_a: 20, wire_awg: 12}
    - {name: separation, nom_a: 2.0, peak_a: 8.0, fuse_a: 10, wire_awg: 16}
    - {name: logic, nom_a: 1.5, peak_a: 3.0, fuse_a: 5, wire_awg: 18}
  battery_wh_usable: 144
  avg_load_w: 160
