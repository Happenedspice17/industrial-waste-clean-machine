repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: branch-name
        name: branch name convention
        entry: python tools/check_branch.py
        language: system
        pass_filenames: false
        always_run: true
      - id: traceability
        name: requirements traceability
        entry: python tools/check_traceability.py
        language: system
        pass_filenames: false
        files: ^(requirements/|tests/)
      - id: commit-msg
        name: conventional commit message
        entry: python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
