# Single source of truth for requirements. Checked by tools/check_traceability.py
# status: draft | approved | verified. Approved/verified SRs need verification, acceptance and verified_by.
stakeholder:
  - {id: R1, text: Lubricant suction / collection, importance: 10}
  - {id: R2, text: Solid-chip separation, importance: 10}
  - {id: R3, text: Compaction system, importance: 6}
  - {id: R4, text: Compact size, importance: 2}
  - {id: R5, text: Safety system, importance: 6}
  - {id: R6, text: Vision system, importance: 6}
  - {id: R7, text: Safe mobility, importance: 10}
  - {id: R8, text: Route storage and mapping, importance: 6}
  - {id: R9, text: Separate solid and liquid containers, importance: 10}
  - {id: R10, text: Operating authorization, importance: 4}

system:
  - id: SR-001
    parent: R1
    module: M3
    priority: must
    text: The collection system shall recover at least 85 % of the spilled liquid mass in one pass over a 1 m2 test patch with the reference lubricant.
    rationale: Metric M1 (liquid).
    verification: Test
    acceptance: ">= 85 % mass recovered, mean of 5 runs"
    status: draft
    verified_by: []
  - id: SR-002
    parent: R2
    module: M4
    priority: must
    text: The separation module shall deliver a solid stream with at least 90 % mass free of drainable oil after compaction.
    rationale: Metric M2 (solids).
    verification: Test
    acceptance: ">= 90 %"
    status: draft
    verified_by: []
  - id: SR-003
    parent: R9
    module: M5
    priority: must
    text: The liquid stream in the storage tank shall contain no more than 5 % by mass of solids larger than 1 mm.
    rationale: Metric M2 (liquid).
    verification: Test
    acceptance: "<= 5 % solids > 1 mm (filtered and weighed)"
    status: draft
    verified_by: []
  - id: SR-004
    parent: R7
    module: M2
    priority: must
    standard: ISO 3691-4:2023 4.3
    text: The robot shall limit its commanded speed to 0.38 m/s in any mode and to 0.15 m/s while cleaning.
    rationale: Speed limit (ISO 3691-4 4.3).
    verification: Test
    acceptance: "Encoder log max <= 0.38 m/s (0.15 m/s cleaning)"
    status: draft
    verified_by: []
  - id: SR-005
    parent: R7
    module: M2
    priority: must
    standard: ISO 3691-4:2023 4.2
    text: The robot shall stop within 0.10 m from 0.38 m/s on a floor contaminated with the reference lubricant.
    rationale: Braking on oil; calculation gives <= 7.4 cm at mu = 0.1.
    verification: Test
    acceptance: "Max of 10 runs <= 0.10 m"
    status: draft
    verified_by: []
  - id: SR-006
    parent: R5
    module: M8
    priority: must
    standard: ISO 3691-4:2023 4.8.1; ISO 13850
    text: Actuating the emergency stop shall remove power from all actuators through a hardware relay independent of software within 100 ms.
    rationale: Safety does not depend on software.
    verification: Test
    acceptance: "All actuator rails < 1 V within 100 ms with firmware halted"
    status: draft
    verified_by: []
  - id: SR-007
    parent: R5
    module: M7
    priority: must
    text: The MCU shall stop all motion if no valid command or heartbeat is received from Linux for longer than T_stale.
    rationale: Lesson 1 — if Linux is late the robot stops. T_stale TBD (measure RPC latency; initial 300 ms).
    verification: Test
    acceptance: "Motion stops <= T_stale + 50 ms after heartbeat loss"
    status: draft
    verified_by: []
  - id: SR-008
    parent: R5
    module: M5
    priority: must
    text: The vacuum unit shall be switched off before liquid reaches the vacuum port, by a float shut-off acting in hardware.
    rationale: Protection term 8.
    verification: Test
    acceptance: "No liquid at port in 5 overfill tests"
    status: draft
    verified_by: []
  - id: SR-009
    parent: R3
    module: M4
    priority: must
    text: The compactor shall limit pressing force to 100 kgf (981 N) +/- 5 % and run only with the chamber lid closed.
    rationale: Protection term 9; NOM-004-STPS interlock.
    verification: Test
    acceptance: "Load-cell peak <= 1030 N; no motion with lid open"
    status: draft
    verified_by: []
  - id: SR-010
    parent: R10
    module: M9
    priority: must
    text: The robot shall start a cleaning cycle only after a valid RFID card is read and the start button is pressed.
    rationale: Authorized operation (R10).
    verification: Test
    acceptance: "0 starts in 20 unauthorized attempts"
    status: draft
    verified_by: []
  - id: SR-011
    parent: R8
    module: M6
    priority: should
    text: The robot shall save a map and a cleaning route and repeat the route with a coverage rate of at least 100 m2/h and zero safety incidents.
    rationale: Metric M3. Simulation estimate 167 m2/h (12 x 8 m cell).
    verification: Test
    acceptance: ">= 100 m2/h on stored route, 0 incidents, 3 runs"
    status: draft
    verified_by: []
  - id: SR-012
    parent: R4
    module: M1
    priority: should
    text: The robot envelope shall not exceed 700 x 500 x 520 mm (L x W x H to LiDAR top).
    rationale: Compact size; fits plant aisles.
    verification: Inspection
    acceptance: "Measured envelope within limits"
    status: draft
    verified_by: []
  - id: SR-013
    parent: SR-004
    module: M2
    priority: must
    standard: ISO 3691-4:2023 4.3.1
    text: The MCU shall stop all motion when the speed measured by the encoders exceeds 0.40 m/s.
    rationale: Overspeed detection independent of the speed command.
    verification: Test
    acceptance: "Stop triggered at 0.40 m/s +/- 0.02 m/s in 5 injected-overspeed tests"
    status: draft
    verified_by: []
  - id: SR-014
    parent: R5
    module: M9
    priority: must
    standard: ISO 3691-4:2023 4.1.14
    text: After any stop caused by a fault or the emergency stop, the robot shall require a new valid RFID card read and a start-button press before moving again.
    rationale: No automatic restart.
    verification: Test
    acceptance: "No motion after fault reset without card + button in 10 tests"
    status: draft
    verified_by: []
  - id: SR-015
    parent: R6
    module: M6
    priority: should
    text: The vision function shall flag residue patches of at least 50 x 50 mm (oil film or chips) left on the cleaned strip, agreeing with operator inspection in at least 90 % of logged frames.
    rationale: R6 task proposed in ADR-0006 (option A). Deferred by ADR-0007 (one camera, used for AprilTag localization). Output is only a re-pass request; vision never stops, steers or blocks the robot.
    verification: Test
    acceptance: ">= 90 % agreement with operator labels over >= 200 frames on the real floor under the robot LED; 0 motion or stop commands issued by vision"
    status: draft
    verified_by: []
  - id: SR-016
    parent: R9
    module: M6
    priority: should
    text: The vision function shall classify the fill level of the liquid tank and of the chip basket as low, half or full, agreeing with the float switches in at least 95 % of logged checks.
    rationale: Container-level cross-check (ADR-0006 option D). Deferred by ADR-0007 (one camera); container level is measured by ultrasonic sensors instead (SR-022, ADR-0010). Floats stay the authority; a disagreement only raises a "check floats" warning.
    verification: Test
    acceptance: ">= 95 % agreement with float states over >= 100 checks per container (fill and drain cycles); 0 stops or tool commands issued by vision"
    status: draft
    verified_by: []
  - id: SR-017
    parent: R6
    module: M6
    priority: must
    text: Each vision output shall remain in log-only mode until its validation protocol (TP-V01 or TP-V02) passes on the real robot and the test report is committed.
    rationale: Validation gate (ADR-0006); camera was untrustworthy on a glossy floor in the maze robot.
    verification: Inspection
    acceptance: "Action flags default to off in code; each enabled flag cites a committed TP-V01 or TP-V02 report"
    status: draft
    verified_by: []
  - id: SR-018
    parent: R6
    module: M6
    priority: should
    text: With one camera, the vision function shall estimate the robot floor pose from a mapped AprilTag 36h11 within 0.10 m and 3 deg (95th percentile) for tags 0.5 to 2.5 m away and within 0.25 m and 5 deg for tags up to 4.0 m away.
    rationale: Absolute re-anchor with a unique ID (ADR-0007); supports encoders + IMU + LiDAR. Never an obstacle or safety sensor; log-only until TP-V02 passes (SR-017).
    verification: Test
    acceptance: ">= 95 % of accepted fixes within the band limits (0.10 m / 3 deg up to 2.5 m; 0.25 m / 5 deg up to 4.0 m) of the surveyed pose over >= 200 fixes at >= 20 surveyed poses on the real floor; 0 accepted fixes from unmapped or moved tags in the spoof/move cases"
    status: draft
    verified_by: []
  - id: SR-019
    parent: SR-018
    module: M6
    priority: should
    text: When two or more mapped AprilTags seen in the same frame give poses that agree within 0.25 m and 8 deg, the localization shall accept their joint fix in that frame and otherwise reject all of them.
    rationale: Owner request (2026-11-22) to trust the camera when it sees 2+ tags; a tag pair per station gives heading without the IMU prior (ADR-0008). Two agreeing tags are the cross-check that rule 6 asks for. Still log-only until TP-V02 passes (SR-017).
    verification: Test
    acceptance: "TP-V02 L1/L3: >= 95 % of multi-tag fixes within SR-018 limits; 0 accepted fixes when one tag of a pair is moved 0.5 m; simulation sim/plant_sim.py: 0 bad fixes from moved tags over 20 maps"
    status: draft
    verified_by: []
  - id: SR-020
    parent: R7
    module: M6
    priority: should
    text: When a camera reports a person within 3.0 m, the LiDAR reports an obstacle within 1.5 m, or the camera gives no usable frame, the Linux application shall limit its speed request to 0.10 m/s until 2 s after the last trigger.
    rationale: Owner request to be more careful near people and obstacles (ADR-0009). Advisory only; it never replaces the MCU stops (bumpers, LiDAR stop zone, watchdog) and the camera is not a safety sensor (ISO 3691-4, ADR-0006).
    verification: Test
    acceptance: "TP-V03: speed request <= 0.10 m/s within 0.5 s of every trigger in >= 95 % of >= 100 person passes; never above the requested speed"
    status: draft
    verified_by: []
  - id: SR-021
    parent: R6
    module: M6
    priority: must
    text: The vision software shall keep no camera image beyond the processing of one frame, with no image files, no frame streams, every buffer it creates zeroed before the frame result is returned, and cameras opened only after core dumps are disabled.
    rationale: Owner request to eliminate or censor processing of people and images and not keep them in memory (ADR-0009, TM-V01, privacy review 2026-11-22). Kernel and OpenCV internal buffers are outside Python's reach; the robot image must disable or encrypt swap.
    verification: Inspection
    acceptance: "Unit tests (test_privacy.py) pass; TP-V03 inspection on the robot image: 0 image files after a 1 h run, no listening frame server, swap off or encrypted, process non-dumpable"
    status: draft
    verified_by: []
  - id: SR-022
    parent: R9
    module: M5
    priority: must
    text: The storage module shall measure the fill level of the liquid tank and of the chip basket with one ultrasonic sensor each, within 10 % of the usable height, and report low, half, full or fault to Linux at least every 200 ms.
    rationale: Owner choice (2026-11-22) of the low-cost HC-SR04 ultrasonic sensor for planning when to return home (ADR-0010). Float shut-off at the vacuum port stays the hardware overfill protection (rule 1).
    verification: Test
    acceptance: "TP-L01: level error <= 10 % of usable height at 5 fill points per container, 3 runs each, with reference oil and chips; fault reported within 0.5 s when a sensor is unplugged"
    status: draft
    verified_by: []
  - id: SR-023
    parent: R8
    module: M7
    priority: should
    text: After each suction round, or when a container level reads full, the robot shall return to the home station and stop within 0.05 m and 3 deg of the dock pose using the two home AprilTags.
    rationale: Owner request for two home tags (ADR-0008); docking only on a fresh fix that sees both home tags.
    verification: Test
    acceptance: "TP-N01: >= 19 of 20 dockings on the real floor within limits from 5 start poses; a failed docking ends stopped and reported, never forced"
    status: draft
    verified_by: []
  - id: SR-024
    parent: R6
    module: M6
    priority: should
    text: The perception module shall carry at least two cameras, one facing forward and one facing backward, each with its own calibration and measured mount.
    rationale: Owner decision (2026-11-22) for the next build; one camera now. Rear view keeps tag fixes while reversing and on the return lane (ADR-0011). Rig choice vs LiDAR in ADR-0011.
    verification: Inspection
    acceptance: "Two calibration files and two measured mounts in the camera list; both cameras give accepted fixes in TP-V02"
    status: draft
    verified_by: []
