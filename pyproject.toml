[project]
name = "waste-robot"
version = "0.1.0"
description = "Autonomous industrial waste cleaning and separation robot (Arduino UNO Q)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "pre-commit>=3.7"]

[tool.setuptools]
packages = ["tools"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["cad", "firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL", "RUF"]
ignore = ["S603", "S607", "PLR2004", "PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests", "linux"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
