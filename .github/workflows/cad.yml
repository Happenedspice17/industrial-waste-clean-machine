name: cad
on:
  pull_request:
    paths: ["cad/**"]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render all parts to STL
        run: |
          mkdir -p cad/out
          for f in cad/parts/*.scad; do bash cad/tools/render.sh "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: stl
          path: cad/out/*.stl
